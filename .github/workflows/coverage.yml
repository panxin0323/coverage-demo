name: PR Coverage Check

on:
  pull_request:
    branches: [ main ]

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest coverage diff-cover

      - name: Run tests and generate coverage
        run: |
          coverage run --source=myapp -m pytest tests/ -v
          coverage xml
          coverage html

      # 生成增量覆盖率摘要（只保留概览，不显示具体行）
      - name: Generate incremental coverage summary
        run: |
          diff-cover coverage.xml \
            --compare-branch=origin/main \
            --html-report diff_coverage.html \
            --markdown-report diff_coverage.md

          # 只保留增量覆盖率概览，去掉未覆盖行详情
          sed -i '/Missing lines/q' diff_coverage.md | head -n 20 > summary_incremental.md

      # 生成简洁的全量覆盖率摘要
      - name: Generate total coverage summary
        run: |
          cat > summary.md << 'EOF'
          ## 📊 覆盖率摘要
          EOF
          echo "### 全量覆盖率" >> summary.md
          coverage report | awk 'NR==1;END{print}' >> summary.md
          echo -e "\n### 增量覆盖率（本次PR）" >> summary.md
          cat summary_incremental.md >> summary.md

      - name: Upload HTML reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            diff_coverage.html
            htmlcov/

      # 只发简洁摘要到 PR 评论
      - name: Post summary to PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: summary.md

      # 卡点
      - name: Check total coverage ≥80%
        run: coverage report --fail-under=80

      - name: Check incremental coverage ≥80%
        run: |
          diff-cover coverage.xml \
            --compare-branch=origin/main \
            --fail-under=80
