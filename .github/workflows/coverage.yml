name: PR Coverage Check

on:
  pull_request:
    branches: [ main ]

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest coverage diff-cover

      # 1. 运行单测，生成覆盖率数据
      - name: Run tests and generate coverage
        run: |
          coverage run --source=myapp -m pytest tests/ -v
          coverage xml
          coverage html  # 生成全量覆盖率 HTML

      # 2. 生成增量覆盖率 HTML（先生成报告）
      - name: Generate incremental coverage HTML
        run: |
          diff-cover coverage.xml \
            --compare-branch=origin/main \
            --html-report diff_coverage.html

      # 3. 上传所有 HTML 报告（先上传，再卡点）
      - name: Upload all coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            diff_coverage.html
            htmlcov/
          if-no-files-found: error

      # 4. 卡全量覆盖率 ≥80%
      - name: Check total coverage ≥80%
        run: |
          coverage report --fail-under=80

      # 5. 卡增量覆盖率 ≥80%
      - name: Check incremental coverage ≥80%
        run: |
          diff-cover coverage.xml \
            --compare-branch=origin/main \
            --fail-under=80
