name: PR Coverage Check

on:
  pull_request:
    branches: [ main ]

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest coverage diff-cover

      - name: Run tests and generate coverage
        run: |
          coverage run --source=myapp -m pytest tests/ -v
          coverage xml

      # 提取增量覆盖率（只保留百分比）
      - name: Generate incremental coverage summary
        run: |
          diff-cover coverage.xml --compare-branch=origin/main > diff.txt
          grep "Coverage:" diff.txt | head -1 > incremental.txt

      # 生成干净的 PR 评论（全量 + 增量都稳定显示）
      - name: Generate coverage comment
        run: |
          echo "## 📊 测试覆盖率摘要" > comment.md
          echo "" >> comment.md

          echo "### 全量覆盖率" >> comment.md
          coverage report --skip-covered | grep TOTAL >> comment.md
          echo "" >> comment.md

          echo "### 增量覆盖率" >> comment.md
          cat incremental.txt >> comment.md

      # 上传报告
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: "*.html"

      # 发到 PR 评论
      - name: Post summary to PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: comment.md

      # 卡点
      - name: Check total coverage ≥80%
        run: coverage report --fail-under=30

      - name: Check incremental coverage ≥80%
        run: diff-cover coverage.xml --compare-branch=origin/main --fail-under=30
