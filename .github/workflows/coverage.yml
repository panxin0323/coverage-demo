name: PR Coverage Check

on:
  pull_request:
    branches: [ main ]

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write  # 必须加，才能评论PR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest coverage diff-cover

      # 1. 运行测试，生成覆盖率
      - name: Run tests and generate coverage
        run: |
          coverage run --source=myapp -m pytest tests/ -v
          coverage xml
          coverage html

      # 2. 生成增量 HTML 报告
      - name: Generate incremental coverage report
        run: |
          diff-cover coverage.xml \
            --compare-branch=origin/main \
            --html-report diff_coverage.html \
            --markdown-report diff_coverage.md

      # 3. 上传报告（仍然是zip，但可以在线预览）
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            diff_coverage.html
            htmlcov/

      # 4. 把增量覆盖率结果发到 PR 评论（不用下载，直接看）
      - name: Post coverage summary to PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: diff_coverage.md

      # 5. 检查全量覆盖率
      - name: Check total coverage
        run: |
          coverage report --fail-under=80

      # 6. 检查增量覆盖率
      - name: Check incremental coverage
        run: |
          diff-cover coverage.xml \
            --compare-branch=origin/main \
            --fail-under=80
