name: PR Coverage Check

on:
  pull_request:
    branches: [ main ]

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest coverage diff-cover

      - name: Run tests and generate coverage
        run: |
          coverage run --source=myapp -m pytest tests/ -v
          coverage xml

      # 生成增量覆盖率信息，并只提取覆盖率百分比，不显示缺失行
      - name: Generate incremental coverage summary
        run: |
          diff-cover coverage.xml --compare-branch=origin/main > diff_result.txt
          # 只提取覆盖率那一行，不显示任何文件/行号
          grep 'Coverage:' diff_result.txt > incremental_summary.txt

      # 生成简洁的全量+增量评论
      - name: Generate PR summary
        run: |
          echo "## 📊 测试覆盖率摘要" > comment.md
          echo "" >> comment.md
          
          echo "### 全量覆盖率" >> comment.md
          coverage report | awk 'END{print "✅ 覆盖率: " $10}' >> comment.md
          echo "" >> comment.md
          
          echo "### 增量覆盖率（本次PR）" >> comment.md
          cat incremental_summary.txt >> comment.md

      # 上传HTML报告（可选）
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: "*.html"

      # 发到PR评论
      - name: Post coverage summary to PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: comment.md

      # 全量卡点
      - name: Check total coverage ≥80%
        run: coverage report --fail-under=80

      # 增量卡点
      - name: Check incremental coverage ≥80%
        run: diff-cover coverage.xml --compare-branch=origin/main --fail-under=80
